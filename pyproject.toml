[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
# RUF001: user-facing strings intentionally contain Turkish chars (ı) and typographic symbols
# RUF012: class-level UPPERCASE constant tables are intentional shared constants, not per-instance state
ignore = ["E501", "B008", "UP042", "RUF001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"spectra/binja/**" = ["F401", "E741"]
"spectra/ida/**" = ["F401"]
"spectra/core/sanitize.py" = ["RUF003"]
"spectra/tools/functions.py" = ["RUF001"]
"spectra/ui/plan_view.py" = ["RUF001"]
# Tests install IDA mocks BEFORE importing spectra — imports after
# sys.path manipulation are the intended pattern here.
"tests/**" = ["E402", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_error_summary = true

[[tool.mypy.overrides]]
module = ["spectra.core.*", "spectra.providers.*"]
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "desloppify>=0.9.3",
]

