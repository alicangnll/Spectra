# Spectra Docker Compose Configuration
# AI-Powered Reverse Engineering Agent

services:
  spectra-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: spectra:latest
    container_name: spectra-cli

    # Interactive mode for CLI
    stdin_open: true
    tty: true

    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - SPECTRA_HOME=/spectra
      - SPECTRA_DATA=/spectra/data

    # Mount volumes for persistence
    volumes:
      # Main data directory (sessions live under /spectra/data/sessions
      # and are persisted by this volume — a nested session volume would
      # shadow it)
      - spectra-data:/spectra/data
      # Built-in skills: the package lives at /spectra/spectra/ in the
      # image (WORKDIR /spectra + COPY spectra/ ./spectra/)
      - ./spectra/skills/builtins:/spectra/spectra/skills/builtins:ro
      # Analysis targets (read-only)
      - ${TARGET_DIR:-./targets}:/targets:ro

    # Working directory inside container
    working_dir: /spectra

    # Network mode (default is bridge, can be changed if needed)
    network_mode: bridge

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

    # Restart policy
    restart: unless-stopped

    # Command (can be overridden)
    command: ["--help"]

volumes:
  spectra-data:
    driver: local

networks:
  default:
    name: spectra-network
